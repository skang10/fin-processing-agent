name: findoc-demo

x-app-environment: &app-environment
  DATABASE_URL: postgresql://findoc:${POSTGRES_PASSWORD}@postgres:5432/findoc
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: findoc
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: findoc-artifacts
  MAX_SOURCE_BYTES: "10000000"
  OCR_MODE: ${OCR_MODE:-fake}
  OCR_MODEL_DIRECTORY: ${OCR_MODEL_DIRECTORY:-}
  PDFIUM_LIB_PATH: ${PDFIUM_LIB_PATH:-}
  ORT_DYLIB_PATH: ${ORT_DYLIB_PATH:-}
  NAPI_RS_NATIVE_LIBRARY_PATH: ${NAPI_RS_NATIVE_LIBRARY_PATH:-}
  FINDOC_SYNTHETIC_DEMO: "true"
  AGENT_DIAGNOSTICS: "true"
  AGENT_MODEL: ${AGENT_MODEL:-fake}
  VLM_MODE: ${VLM_MODE:-fixture}
  VLM_MODEL: ${VLM_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
  VLM_MODEL_API_KEY: ${VLM_MODEL_API_KEY:-}
  PI_OFFLINE: ${PI_OFFLINE:-1}

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: findoc
      POSTGRES_USER: findoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findoc -d findoc"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data
    environment:
      MINIO_ROOT_USER: findoc
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: pnpm db:migrate
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: pnpm --filter @findoc/api start
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: pnpm --filter @findoc/worker start
    environment:
      <<: *app-environment
      WORKER_HEALTH_HOST: 0.0.0.0
    volumes:
      - ./models:/app/models:ro
      - ./native-libs:/app/native-libs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build: .
    command: pnpm --filter @findoc/web exec vite preview
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

  demo-loader:
    build: .
    profiles: ["tools"]
    command: node scripts/load-demo.mjs
    environment:
      API_BASE_URL: http://api:3000
      REVIEW_WEB_URL: http://localhost:5173
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
